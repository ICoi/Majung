<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="소중한 만남에 초대합니다. 전달받으신 비밀번호로 초대장을 열어 주세요.">
  <meta property="og:title" content="상견례 초대장">
  <meta property="og:description" content="소중한 만남에 초대합니다.">
  <title>상견례 초대장</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf8f3; color: #343c32; font: 1.125rem/1.85 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; overflow-wrap: anywhere; }
    main { width: 100%; max-width: 32rem; padding: 4rem 1.5rem; margin: auto; }
    .flower { color: #7c896d; font-size: 2.5rem; margin: 0 0 2rem; }
    .eyebrow { font-size: .9rem; color: #58684d; letter-spacing: .14em; }
    h1 { font-family: "AppleMyungjo", "Batang", serif; font-size: 2rem; font-weight: 400; line-height: 1.5; margin: 1rem 0 1.2rem; }
    p { margin: 0 0 1.5rem; }
    form { border-top: 1px solid #d9dcd1; margin-top: 2.5rem; padding-top: 2rem; }
    label { display: block; margin-bottom: .5rem; }
    input, button { font: inherit; line-height: 1.6; width: 100%; min-height: 3.25rem; border-radius: .3rem; padding: .85rem 1rem; }
    input { border: 1px solid #8d9980; background: #fffefa; color: #343c32; min-width: 0; }
    button { border: 1px solid #58684d; background: #58684d; color: white; margin-top: 1rem; white-space: normal; overflow-wrap: anywhere; cursor: pointer; }
    button:disabled { opacity: .7; cursor: wait; }
    button:focus-visible, input:focus-visible { outline: 3px solid #58684d; outline-offset: 4px; }
    .toggle { background: transparent; color: #435339; margin-top: .6rem; }
    .note { font-size: .95rem; color: #646b60; margin-top: 1.3rem; }
    #error { color: #923a2a; margin-top: 1rem; }
    #error:empty { margin: 0; }
    .sample { border: 1px solid #c6cebb; padding: .8rem; font-size: .95rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <main>
    <p class="flower" aria-hidden="true">✳</p>
    <p class="eyebrow">소중한 첫 만남</p>
    <h1>반가운 마음으로<br>초대합니다</h1>
    <p>전달받으신 비밀번호를 입력하시면<br>초대장을 보실 수 있어요.</p>
    <form id="unlock-form">
      <label for="password">초대장 비밀번호</label>
      <input id="password" name="password" type="password" required autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="error" aria-invalid="false">
      <button type="button" class="toggle" id="toggle" aria-controls="password" aria-pressed="false">비밀번호 보기</button>
      <button type="submit" id="unlock">초대장 열기</button>
      <p id="error" role="alert" aria-live="assertive"></p>
    </form>
    <p class="note">비밀번호를 모르시면 초대장을 보내주신 분께 문의해 주세요.</p>
    {{sampleNote}}
    <noscript><p>초대장을 열려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
  </main>
  <script>
    const staticryptInitiator = /*[|js_staticrypt|]*/0;
    const staticryptConfig = /*[|staticrypt_config|]*/0;
    const staticrypt = staticryptInitiator.init(staticryptConfig, {
      replaceHtmlCallback(html) { document.open(); document.write(html); document.close(); }
    });
    const form = document.getElementById('unlock-form');
    const password = document.getElementById('password');
    const error = document.getElementById('error');
    const submit = document.getElementById('unlock');
    document.getElementById('toggle').addEventListener('click', (event) => {
      const show = password.type === 'password';
      password.type = show ? 'text' : 'password';
      event.currentTarget.textContent = show ? '비밀번호 숨기기' : '비밀번호 보기';
      event.currentTarget.setAttribute('aria-pressed', String(show));
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      error.textContent = '';
      password.setAttribute('aria-invalid', 'false');
      submit.disabled = true;
      submit.textContent = '초대장을 여는 중…';
      try {
        if (!window.crypto?.subtle) throw new Error('secure-context');
        const result = await staticrypt.handleDecryptionOfPage(password.value, false);
        if (!result.isSuccessful) {
          error.textContent = '비밀번호가 맞지 않아요. 전달받으신 비밀번호를 다시 확인해 주세요.';
          password.setAttribute('aria-invalid', 'true');
          password.focus();
        }
      } catch {
        error.textContent = '초대장을 열지 못했어요. HTTPS 주소를 기본 Safari 또는 Chrome에서 다시 열어 주세요.';
      } finally {
        submit.disabled = false;
        submit.textContent = '초대장 열기';
      }
    });
  </script>
</body>
</html>
